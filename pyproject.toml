[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "das-ani"
version = "0.1.0"
description = "DAS Ambient Noise Interferometry (ANI) pipeline: preprocessing, cross-correlation, stacking, dispersion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Benz Poobua" }
]

# -----------------------
# Core runtime deps
# -----------------------
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "tqdm>=4.66",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "zarr>=2.14",

  # torch is platform-specific (CPU/CUDA/MPS)
  "torch>=2.1",
  
  # ---- Surface-wave modelling & inversion ----
  "disba>=0.6",
  "evodcinv"
]

# -----------------------
# Optional dependencies
# -----------------------
[project.optional-dependencies]

# Development / QA
dev = [
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "pytest>=8.2",
  "types-PyYAML>=6.0.12.20240917",
]

# Visualization & reporting (used by eval_modes + SSIM)
viz = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "seaborn>=0.13",
  "scikit-image>=0.22",
  "plotly>=5.18",
]

# Jupyter / interactive work
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
]

# Test features (not for production)
experimental = [
  "daspack-dev",
]

# -----------------------
# setuptools configuration
# -----------------------
[tool.setuptools]
# If your code is directly inside 'src', this map is correct.
# Often structure is src/das_ani/... but if you import src.cc, 
# then mapping ""="src" makes "src" the root package.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# -----------------------
# Ruff (linting)
# -----------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

# -----------------------
# Black (formatting)
# -----------------------
[tool.black]
line-length = 100
target-version = ["py310"]

# -----------------------
# MyPy (typing)
# -----------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true

# -----------------------
# Pytest
# -----------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
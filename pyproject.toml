[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "das-ani"
version = "0.1.0"
description = "DAS Ambient Noise Interferometry (ANI) pipeline: preprocessing, cross-correlation, stacking, dispersion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Benz Poobua" }
]

# -----------------------
# Core runtime deps
# -----------------------
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "tqdm>=4.66",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "zarr>=2.14",
  "numcodecs>=0.11",

  # used by src.eval and src.dvv
  "pandas>=2.0",

  # torch is platform-specific (CPU/CUDA/MPS)
  "torch>=2.1",

  # ---- Surface-wave modelling & inversion ----
  "disba>=0.6",
  "evodcinv"
]

# -----------------------
# Optional dependencies
# -----------------------
[project.optional-dependencies]

# Development / QA
dev = [
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "pytest>=8.2",
  "types-PyYAML>=6.0.12.20240917",
]

# Visualization & reporting (SSIM in src.error, plots)
viz = [
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "scikit-image>=0.22",
  "plotly>=5.18",
]

# Post-processing pipelines (dask-parallel NCF batch jobs in src.ncf)
postprocess = [
  "dask>=2024.1",
]

# Jupyter / interactive work
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
]

# Test features (not for production)
experimental = [
  "daspack-dev",
]

# -----------------------
# setuptools configuration
# -----------------------
# The code is imported as `src.cc`, `src.ani`, ... (a flat `src` package).
# Declaring packages = ["src"] makes `pip install -e .` provide exactly that
# import path. (The previous package-dir = {""="src"} mapping exposed the
# modules as top-level `cc`, `ani`, ... which broke `python -m src.cc` in
# installed environments.)
[tool.setuptools]
packages = ["src"]

# -----------------------
# Ruff (linting)
# -----------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

# -----------------------
# Black (formatting)
# -----------------------
[tool.black]
line-length = 100
target-version = ["py310"]

# -----------------------
# MyPy (typing)
# -----------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true

# -----------------------
# Pytest
# -----------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
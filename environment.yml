name: das-ani

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # -----------------------------
  # Core language
  # -----------------------------
  - python=3.10

  # -----------------------------
  # Scientific stack (compiled)
  # -----------------------------
  - numpy
  - scipy
  - psutil
  - tqdm
  - pyyaml

  # -----------------------------
  # PyTorch (CPU by default)
  # -----------------------------
  - pytorch>=2.1
  - torchvision
  - torchaudio

  # -----------------------------
  # System / performance libs
  # -----------------------------
  - mkl
  - fftw

  # -----------------------------
  # Pip bridge
  # -----------------------------
  - pip

  # -----------------------------
  # Install this project
  # -----------------------------
  - pip:
      - -e .
# =============================================================================
# Configuration: Offshore DAS Ambient Noise Interferometry
# Target: Scholte waves (1.0 - 4.9 Hz) in marine sediments
# =============================================================================

paths:
  data_root: ./data/raw_offshore
  output_root: ./data/ncf_raw_offshore

runtime:
  njobs: 4
  use_gpu: false
  mmap: true
  frac_mem: 0.25
  min_chunk: 64
  max_chunk: 4096
  torch_compile: false
  compile_mode: max-autotune

data:
  fs_raw: 10.0
  first_chan: 0
  last_chan: 3191
  dx: 10.0
  src_stride: 10         # every 10th channel
  min_length_sec: 60.0

preprocess:
  decimation: 1
  f1: 1.0
  f2: 4.9
  diff: false
  ram_win_sec: 1.0

xcorr:
  # method switch
  mode: conventional # conventional or v1
  auto_cc: false      # set to true for Coda Wave Interferometry (ACF)

  # whitening
  is_spectral_whitening: true 
  window_freq_hz: 0.0

  # lags of interest
  max_lag_sec: 10.0

  # window for benchmark and v1
  xcorr_seg_sec: 204.8       # segment length (2048 samples = Power of Two)
  xcorr_seg_sec_v1: 204.8    # v1 specific segment length mapping

  # v1 block settings
  v1_fft_snap_pow2: true     # snap (K+2M) to power-of-two FFT length
  v1_fallback: v1_2M         # "v1_2M" or "v1_Mp1"

perf:
  enabled: true
  out_path: ./data/runlogs/offshore_perf_cc.csv   # append rows per run (mode/file/vs)
  log_every_vs: true
  log_every_chunk: false

stacking:
  enabled: true
  raw_root: ./data/ncf_raw_offshore
  stacks_root: ./data/ncf_stacks_offshore
  overwrite: false

  base_stack: 1d # fundamental unit; or 1h

  windows:
    # 2h: true
    # 6h: true
    # 1d: false  # or set to true if we still want a 24hr trend
    7d: false
    15d: false
    30d: false
io:
  ncf_root: "data/ncf_stacks"
  results_root: "results/dispersion"
  stack_window: "daily"
  vs_subdir: true

geometry:
  fs: 250.0                  # Hz (sampling rate used when building time axis)
  dx: 8.16                   # meters

fv:
  vmin: 200.0
  vmax: 4000.0
  dv: 10.0

  fmin: 0.1
  fmax: 50.0

  normalize: true

runtime:
  njobs: 4
  device: "auto"             # "auto", "cpu", "cuda", "mps"
  batch_size_v: null         # e.g., 64; null -> heuristic
  empty_cache: true

picking:
  enabled: true
  step: 5

  # Optional multi-start picks:
  # - start at these frequencies
  # - but do not allow velocities above vmax_set at those start freqs
  f_ref_set: null            # e.g., [0.5, 1.0, 2.0]
  vmax_set: null             # e.g., [3500, 3000, 2500]

save:
  overwrite: false
  save_panel: true
  save_axes: true
  save_pick: true
  save_meta: true
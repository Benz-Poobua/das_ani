# =============================================================================
# Configuration: Urban DAS Ambient Noise Interferometry  (CPU)
# Target: Rayleigh waves (1.0 - 10.0 Hz) in urban sediments
# =============================================================================
#
# Pipeline (CPU, preprocess.mode = pure_numpy):
#   ingest  -> decimate_raw / differentiate_cpu        (once per file)
#   preprocess -> detrend + bandpass + median + RAM    (per window, NumPy/SciPy)
#   whiten + cross-correlation                         (torch, CPU)

paths:
  data_root: ./data/raw_urban #_zarr
  output_root: ./data/ncf_raw_urban #_zarr

runtime:
  njobs: 8
  use_gpu: false
  mmap: true
  frac_mem: 0.25
  min_chunk: 64
  max_chunk: 4096
  torch_compile: false
  compile_mode: reduce-overhead

data:
  fs_raw: 250.0
  first_chan: 399
  last_chan: 748
  dx: 8.16
  src_stride: 10         # every 10th channel
  min_length_sec: 60.0

# -----------------------------------------------------------------------------
# Ingest stage: applied ONCE to the raw buffer, before per-window preprocessing.
# Both keys live here (not under preprocess) to match src/ani.py Option A:
#   - decimation: anti-aliased downsampling via decimate_raw()
#   - diff:       strain -> strain-rate via differentiate_cpu() (np.gradient)
# -----------------------------------------------------------------------------
ingest:
  decimation: 1
  diff: false

preprocess:
  # Per-window stage: detrend + bandpass + median + temporal normalization.
  #
  # mode selects the backend (same stage order in all three):
  #   pure_numpy : all-CPU scipy/numpy. Legacy, bit-exact benchmark.
  #   hybrid     : scipy detrend+bandpass (canonical sosfiltfilt) -> torch
  #                median + temporal norm. Numerical-fidelity choice when a
  #                torch device is in play; identical to pure_numpy within
  #                float32 round-off.
  #   pure_torch : all stages in torch, incl. the rFFT-domain |H(f)|^2
  #                bandpass. GPU-tailored; approximates sosfiltfilt.
  # If omitted: use_gpu=false -> pure_numpy, use_gpu=true -> hybrid.
  mode: pure_numpy
  f1: 1.0
  f2: 10.0
  ram_win_sec: 0.0

xcorr:
  # method switch
  mode: v1 # conventional or v1
  auto_cc: false      # set to true for Coda Wave Interferometry (ACF)


  # whitening
  is_spectral_whitening: false
  window_freq_hz: 0.0

  # lags of interest
  max_lag_sec: 2.0

  # window for benchmark and v1
  xcorr_seg_sec: 60.0
  xcorr_seg_sec_v1: 60.0

  # v1 block settings
  v1_fft_snap_pow2: true     # snap (K+2M) to power-of-two FFT length
  v1_fallback: v1_2M         # "v1_2M" or "v1_Mp1"

perf:
  enabled: true
  out_path: ./data/runlogs/perf_cc.csv   # append rows per run (mode/file/vs)
  log_every_vs: true
  log_every_chunk: false

stacking:
  enabled: true
  raw_root: ./data/ncf_raw_urban 
  stacks_root: ./data/ncf_stacks_urban
  overwrite: false

  base_stack: 1d # fundamental unit; or 1h

  windows:
    # 2h: true
    7d: true
    15d: true
    30d: true